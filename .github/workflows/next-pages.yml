name: Validate separate DROGS registration branch
on:
  push:
    branches: [codex/annual-registration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /drogs-registration
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_PAYMENT_INSTRUCTIONS: ${{ vars.NEXT_PUBLIC_PAYMENT_INSTRUCTIONS }}
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: registration-site
          path: out
          include-hidden-files: true
